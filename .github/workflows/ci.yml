name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pinned vcpkg commit. Must match "builtin-baseline" in vcpkg.json so that
# dependency versions are identical locally and in CI, on every platform.
env:
  VCPKG_COMMIT: 2475cc332a47b3a63bb3de58293bdab7726613ca

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: debug
          - os: windows-latest
            preset: debug
          - os: ubuntu-latest
            preset: asan     # AddressSanitizer + UBSan

    steps:
      - uses: actions/checkout@v4

      # Use our own pinned vcpkg instead of the runner's preinstalled one, so the
      # builtin-baseline always resolves and versions match across platforms.
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> "$GITHUB_ENV"

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Puts cl.exe + ninja on PATH so the Ninja generator finds MSVC.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin clang-format so CI matches local formatting (avoid version drift).
      - name: Install clang-format
        run: pipx install "clang-format>=21,<22"
      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
